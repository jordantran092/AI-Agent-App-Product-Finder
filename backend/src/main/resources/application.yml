spring:
  application:
    name: product-finder
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_finder}
    username: ${DB_USERNAME:product_finder}
    password: ${DB_PASSWORD:product_finder_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
