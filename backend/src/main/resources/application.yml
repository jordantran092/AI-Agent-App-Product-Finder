spring:
  application:
    name: product-finder
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_finder}
    username: ${DB_USERNAME:product_finder}
    password: ${DB_PASSWORD:product_finder_local}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

product-finder:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    connect-timeout: ${DEEPSEEK_CONNECT_TIMEOUT:5s}
    read-timeout: ${DEEPSEEK_READ_TIMEOUT:30s}
    max-attempts: ${DEEPSEEK_MAX_ATTEMPTS:3}
    initial-backoff: ${DEEPSEEK_INITIAL_BACKOFF:250ms}
    max-backoff: ${DEEPSEEK_MAX_BACKOFF:2s}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
